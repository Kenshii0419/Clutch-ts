<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Support — YouMadeIt Iloilo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/config.js"></script>
<script type="module" src="/js/init.js"></script>
<script type="module">
  import { initSupabase } from '/js/init.js';
  initSupabase();
  import { renderHeader } from '/js/nav.js';
  renderHeader({ currentPage: 'contact' });
</script>
<div id="setup-banner"></div>

<main class="page-main">
  <div class="container section">
    <div class="page-sheet" style="max-width: 760px; margin: 0 auto;">
      <h1 class="section-title">Contact Support</h1>
      <p class="text-secondary">Questions about your order, account approval, or selling in Iloilo? Send a note to the YouMadeIt team.</p>
      <form id="contact-form">
        <div class="grid grid-cols-2" style="gap: 1rem;">
          <div class="form-group">
            <label for="contact-name">Name</label>
            <input type="text" id="contact-name" class="form-input" required>
          </div>
          <div class="form-group">
            <label for="contact-email">Email</label>
            <input type="email" id="contact-email" class="form-input" required>
          </div>
        </div>
        <div class="form-group">
          <label for="contact-subject">Subject</label>
          <input type="text" id="contact-subject" class="form-input" required placeholder="e.g. Question about seller onboarding">
        </div>
        <div class="form-group">
          <label for="contact-message">Message</label>
          <textarea id="contact-message" class="form-textarea" required placeholder="How can we help?"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
        <p class="form-hint" style="margin-bottom:0">Looking to ask a specific artist about materials or local meetup? Use "Message the Maker" on their product or storefront page.</p>
      </form>
    </div>
  </div>
</main>

<script type="module" src="/js/pages/contact.js"></script>
</body>
</html>
