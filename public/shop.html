<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — YouMadeIt</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/config.js"></script>
<script type="module" src="/js/init.js"></script>
<script type="module">
  import { initSupabase } from '/js/init.js';
  initSupabase();
  import { renderHeader } from '/js/nav.js';
  renderHeader({ currentPage: 'shop' });
</script>
<div id="setup-banner"></div>
<div class="container section warm-bg">
  <div class="section-header" style="margin-bottom: var(--space-6); flex-wrap: wrap; gap: var(--space-4);">
    <div>
      <h2 class="section-title">Discover handmade goods</h2>
      <p class="section-subtitle">Browse unique creations from independent makers across every category.</p>
    </div>
    <div class="nav-actions" style="margin-left: auto;">
      <a href="seller-dashboard.html" class="btn btn-outline btn-sm">Start selling &rarr;</a>
    </div>
  </div>

  <div class="list-toolbar" style="margin-bottom: var(--space-6);">
    <div class="list-toolbar-left">
      <form id="search-form" class="flex" style="margin:0; flex:1; min-width: 280px;">
        <input type="search" id="search-q" name="q" class="form-input" placeholder="Search products, makers, materials…" style="min-width:min(320px,70vw)">
        <button type="submit" class="btn btn-primary">Search</button>
        <a href="shop.html" class="btn btn-ghost">Clear</a>
      </form>
    </div>
    <div class="list-toolbar-right">
      <button id="toggle-filters" type="button" class="btn btn-outline btn-sm">Filters</button>
      <div class="sort-control">
        <label for="shop-sort">Sort</label>
        <select id="shop-sort" class="form-select">
          <option value="newest">Date added: newest</option>
          <option value="oldest">Date added: oldest</option>
          <option value="alpha-asc">Alphabetical: A–Z</option>
          <option value="alpha-desc">Alphabetical: Z–A</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
        </select>
      </div>
    </div>
  </div>

  <aside id="filters-panel" class="content-box" style="display:none; margin-bottom: var(--space-6);">
    <h3 style="margin-top:0">Filters</h3>
    <div id="filters-content"></div>
    <button id="apply-filters" type="button" class="btn btn-primary btn-block" style="margin-top: var(--space-3)">Apply filters</button>
    <button id="reset-filters" type="button" class="btn btn-ghost btn-block" style="margin-top: var(--space-2)">Reset</button>
  </aside>
  <div id="active-filters" style="margin-bottom: var(--space-4); display:none;"></div>
  <div id="shop-grid" class="grid grid-cols-4"></div>
  <div id="shop-pagination" class="flex-between" style="margin-top: var(--space-6);"></div>
</div>
<script type="module" src="/js/pages/shop.js"></script>
</body>
</html>
