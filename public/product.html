<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — YouMadeIt</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/config.js"></script>
<script type="module" src="/js/init.js"></script>
<script type="module">
  import { initSupabase } from '/js/init.js';
  initSupabase();
  import { renderHeader } from '/js/nav.js';
  renderHeader({ currentPage: 'shop' });
</script>
<div id="setup-banner"></div>
<div class="container section warm-bg">
  <a href="shop.html" class="btn-ghost" style="margin-bottom: var(--space-4);">&larr; Back to shop</a>
  <div id="product-loading" class="loading-state" style="text-align:center"><div class="skeleton-lg"></div></div>
  <div id="product-content" style="display:none">
    <div class="content-box" style="margin-bottom: var(--space-6);">
      <div class="detail-grid">
        <div style="min-width: 0;">
          <div id="product-gallery-main" class="detail-gallery-main"></div>
          <div id="product-gallery-thumbs" class="flex" style="margin-top: var(--space-3); flex-wrap: wrap; gap: 0.5rem;"></div>
        </div>
        <div class="detail-info">
          <div id="product-meta" class="flex" style="gap: var(--space-2); margin-bottom: var(--space-3); flex-wrap: wrap;"></div>
          <h1 id="product-name" style="margin-bottom: var(--space-2);"></h1>
          <div class="product-seller" style="margin-bottom: var(--space-4);">by <span id="product-seller-name" style="color: var(--color-sage); font-weight: 500;"></span></div>
          <div id="product-price" class="product-price" style="font-size: 2rem; margin-bottom: var(--space-4);"></div>
          <p id="product-description" style="white-space: pre-wrap; line-height: 1.8; margin-bottom: var(--space-6);"></p>
          <div id="product-attrs" class="content-box" style="margin: 0 0 var(--space-6); padding: var(--space-4); background: var(--color-ivory);"></div>
          <div id="product-actions" style="margin-top: var(--space-2);"></div>
          <div id="product-stock" style="margin-top: var(--space-3);"></div>
        </div>
      </div>
    </div>
    <div class="content-box" style="margin-bottom: var(--space-6);">
      <h3 style="margin-top:0">Reviews</h3>
      <div id="product-reviews"></div>
    </div>
    <div class="content-box">
      <h3 style="margin-top:0">You may also like</h3>
      <div id="product-related" class="grid grid-cols-4"></div>
    </div>
  </div>
  <div id="product-not-found" class="empty-state" style="display:none"><h2>Product not found</h2><p>This listing is no longer available.</p></div>
</div>
<script type="module" src="/js/pages/product.js"></script>
</body>
</html>
