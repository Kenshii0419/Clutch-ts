<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — YouMadeIt Iloilo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/config.js"></script>
<script type="module" src="/js/init.js"></script>
<script type="module">
  import { initSupabase } from '/js/init.js';
  initSupabase();
  import { renderHeader } from '/js/nav.js';
  renderHeader({ currentPage: 'reset-password' });
</script>
<div id="setup-banner"></div>

<main class="page-main">
  <div class="container section-sm">
    <div class="content-box" style="max-width: 500px; margin: 0 auto;">
      <h1 class="section-title" style="font-size:1.75rem">Reset your password</h1>
      <p class="text-secondary">Enter your email address and we&rsquo;ll send you a link to set a new password.</p>
      <form id="reset-form">
        <div class="form-group">
          <label for="reset-email">Email address</label>
          <input type="email" id="reset-email" name="email" class="form-input" required placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
        <p class="form-hint" style="margin-top: 1rem; text-align:center; margin-bottom:0">Remember your password? <a href="login.html">Sign in</a></p>
      </form>
    </div>
  </div>
</main>

<script type="module" src="/js/pages/auth-page.js"></script>
<script type="module">
  import { setupReset } from '/js/pages/auth-page.js';
  setupReset(document.getElementById('reset-form'));
</script>
</body>
</html>
