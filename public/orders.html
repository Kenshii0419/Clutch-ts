<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — YouMadeIt Iloilo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/config.js"></script>
<script type="module" src="/js/init.js"></script>
<script type="module">
  import { initSupabase } from '/js/init.js';
  initSupabase();
  import { renderHeader } from '/js/nav.js';
  renderHeader({ currentPage: 'orders' });
</script>
<div id="setup-banner"></div>

<main class="page-main">
  <div class="container section">
    <div class="section-header" style="margin-bottom: var(--space-4);">
      <div>
        <h1 class="section-title">My Orders</h1>
        <p class="section-subtitle">Track purchases, confirm deliveries, and leave verified maker reviews.</p>
      </div>
      <a href="shop.html" class="btn btn-ghost btn-sm">&larr; Back to shop</a>
    </div>

    <div id="orders-require-login" class="content-box empty-state" style="display:none">
      <h3>Sign in to view your orders</h3>
      <p>Track shipping updates and order history on your account.</p>
      <a href="login.html?next=orders.html" class="btn btn-primary">Sign in</a>
    </div>

    <div id="orders-loading" class="loading-state"><div class="skeleton-lg"></div></div>

    <div class="content-box" id="orders-content-box" style="display:none">
      <div class="list-toolbar">
        <div class="list-toolbar-left">
          <span class="text-secondary" style="font-size:0.9rem; font-weight:700">Order History</span>
        </div>
        <div class="list-toolbar-right">
          <div class="sort-control">
            <label for="orders-sort">Sort</label>
            <select id="orders-sort" class="form-select">
              <option value="date-desc">Date: Newest</option>
              <option value="date-asc">Date: Oldest</option>
              <option value="total-desc">Total: High to Low</option>
              <option value="total-asc">Total: Low to High</option>
              <option value="alpha-asc">Order #: A–Z</option>
            </select>
          </div>
        </div>
      </div>
      <div id="orders-list"></div>
    </div>

    <div id="orders-detail" class="content-box" style="display:none"></div>
  </div>
</main>

<script type="module" src="/js/pages/orders.js"></script>
</body>
</html>
