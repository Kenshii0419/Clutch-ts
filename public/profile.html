<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — YouMadeIt Iloilo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/config.js"></script>
<script type="module" src="/js/init.js"></script>
<script type="module">
  import { initSupabase } from '/js/init.js';
  initSupabase();
  import { renderHeader } from '/js/nav.js';
  renderHeader({ currentPage: 'profile' });
</script>
<div id="setup-banner"></div>

<main class="page-main">
  <div class="container section">
    <h1 class="section-title">My Profile</h1>

    <div id="profile-require-login" class="content-box empty-state" style="display:none">
      <h3>Sign in to view your profile</h3>
      <p>Manage your avatar, bio, account status, and marketplace messages.</p>
      <a href="login.html?next=profile.html" class="btn btn-primary">Sign in</a>
    </div>

    <div id="profile-wrap" style="display:none">
      <div id="profile-approval-banner" class="sticky-note" style="display:none; margin-bottom: var(--space-4);"></div>

      <div class="content-box" style="margin-bottom: var(--space-6);">
        <div class="grid grid-cols-2" style="align-items: start;">
          <div style="display:flex;flex-direction:column;align-items:center">
            <img id="profile-avatar" src="/images/YouMadeIt_-removebg-preview.png" width="128" height="128" style="border-radius: 50%; border: 3px solid var(--border-strong); object-fit: cover; background: var(--color-cream);" alt="Profile avatar">
            <label class="image-upload" for="profile-avatar-file" style="width:100%; max-width: 260px; margin-top: 1rem;">
              <input type="file" id="profile-avatar-file" accept="image/jpeg,image/png,image/webp">
              <strong style="font-size:0.9rem; display:block">Upload Profile Photo</strong>
              <span class="text-secondary" style="font-size:0.8rem">JPEG, PNG, or WebP up to 2 MB</span>
            </label>
          </div>
          <div>
            <form id="profile-form">
              <div class="form-group">
                <label for="profile-name">Display name</label>
                <input type="text" id="profile-name" name="display_name" class="form-input" required>
              </div>
              <div class="form-group">
                <label for="profile-email">Email</label>
                <input type="email" id="profile-email" name="email" class="form-input" required>
              </div>
              <div class="form-group">
                <label for="profile-bio">Bio</label>
                <textarea id="profile-bio" name="bio" class="form-textarea" placeholder="Share a bit about yourself or what crafts you love…"></textarea>
              </div>
              <div class="flex" style="margin-bottom: 1rem;">
                <div><strong>Role:</strong> <span id="profile-role" class="text-secondary"></span></div>
                <div><strong>Status:</strong> <span id="profile-approval-status" class="badge badge-outline">Loading</span></div>
              </div>
              <button type="submit" class="btn btn-primary" id="profile-save-btn">Save Changes</button>
            </form>
          </div>
        </div>
      </div>

      <div class="content-box" style="margin-bottom: var(--space-6);">
        <h3 style="margin-top:0">Your Activity</h3>
        <div class="stat-grid">
          <div class="metric-card"><div class="label">Orders</div><div class="value" id="stat-orders">-</div></div>
          <div class="metric-card"><div class="label">Favorites</div><div class="value" id="stat-favorites">-</div></div>
          <div class="metric-card"><div class="label">Member Since</div><div class="value" id="stat-member">-</div></div>
          <div class="metric-card"><div class="label">Maker Studio</div><div class="value" style="font-size:1.15rem;margin-top:0.35rem"><a href="seller-dashboard.html">Open Studio &rarr;</a></div></div>
        </div>
      </div>

      <div class="grid grid-cols-2" style="gap: 1.25rem; align-items: start;">
        <section class="content-box" aria-labelledby="profile-notif-title">
          <h3 id="profile-notif-title" style="margin-top:0">Notifications</h3>
          <div id="profile-notifications-list" class="admin-queue-list" aria-live="polite"></div>
        </section>

        <section id="admin-messages" class="content-box" aria-labelledby="admin-messages-title">
          <h3 id="admin-messages-title" style="margin-top:0">Messages from Administration</h3>
          <div id="admin-messages-list" class="admin-queue-list" aria-live="polite"></div>
        </section>
      </div>
    </div>
  </div>
</main>

<script type="module" src="/js/pages/profile.js"></script>
</body>
</html>
